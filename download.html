<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGRace ダウンロード</title>
</head>
<body>
  <main>
    <h1>AGRace ダウンロード</h1>
    <p id="status" aria-live="polite">最新版の配布ファイルを確認しています…</p>
    <p>自動でダウンロードが始まらない場合は、<a href="https://github.com/lubin851/AGRaceBlenderSample/releases/latest">最新版のRelease</a>を開いてください。</p>
    <noscript><p>自動ダウンロードにはJavaScriptが必要です。</p></noscript>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const file = new URLSearchParams(window.location.search).get("file");
      if (file !== "addon" && file !== "sample") {
        status.textContent = "ダウンロードの種類を確認できませんでした。";
        return;
      }

      try {
        const response = await fetch(
          "https://api.github.com/repos/lubin851/AGRaceBlenderSample/releases/latest",
          { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" }
        );
        if (!response.ok) throw new Error("Release lookup failed");
        const release = await response.json();
        const version = /^v(\d+\.\d+\.\d+)$/.exec(release.tag_name)?.[1];
        if (!version) throw new Error("Unexpected release tag");

        const name = file === "addon"
          ? `agrace_tools-${version}.zip`
          : "AGRaceCourse_Template.zip";
        const asset = release.assets.find((item) => item.name === name);
        if (!asset) throw new Error("Release asset not found");

        const target = new URL(asset.browser_download_url);
        if (target.origin !== "https://github.com" ||
            !target.pathname.startsWith("/lubin851/AGRaceBlenderSample/releases/download/")) {
          throw new Error("Unexpected download URL");
        }
        status.textContent = `${name} のダウンロードを開始します…`;
        window.location.replace(target.href);
      } catch (error) {
        status.textContent = "自動ダウンロードに失敗しました。最新版のReleaseからZIPを選択してください。";
      }
    })();
  </script>
</body>
</html>
