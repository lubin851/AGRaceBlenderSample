name: Publish AGRace Blender files

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agrace-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Check tag and manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          manifest = tomllib.loads(Path('Add_on/AGRaceTools/agrace_tools/blender_manifest.toml').read_text(encoding='utf-8'))
          version = manifest['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match manifest version {version!r} as vX.Y.Z')
          if manifest['id'] != 'agrace_tools':
              raise SystemExit('Unexpected Blender extension ID')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'EXTENSION_VERSION={version}\n')
          PY

      - name: Download Blender 5.1.1
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/blender.tar.xz" \
            https://download.blender.org/release/Blender5.1/blender-5.1.1-linux-x64.tar.xz
          tar --extract --file "$RUNNER_TEMP/blender.tar.xz" --directory "$RUNNER_TEMP"
          blender_binary="$RUNNER_TEMP/blender-5.1.1-linux-x64/blender"
          "$blender_binary" --version
          echo "BLENDER_BINARY=$blender_binary" >> "$GITHUB_ENV"

      - name: Build and validate the extension
        run: |
          mkdir -p dist/pages dist/release
          "$BLENDER_BINARY" --background --factory-startup --command extension validate \
            Add_on/AGRaceTools/agrace_tools
          "$BLENDER_BINARY" --background --factory-startup --command extension build \
            --source-dir Add_on/AGRaceTools/agrace_tools \
            --output-dir dist/pages
          package="dist/pages/agrace_tools-${EXTENSION_VERSION}.zip"
          test -f "$package"
          "$BLENDER_BINARY" --background --factory-startup --command extension validate "$package"

      - name: Verify Blender sample dependencies
        run: |
          "$BLENDER_BINARY" --background --factory-startup --disable-autoexec \
            BlenderSample/AGRaceCourse_Template.blend --python-exit-code 1 \
            --python-expr "import bpy, os; assert not bpy.data.libraries, 'Linked Blender libraries found'; missing = [image.filepath for image in bpy.data.images if image.source == 'FILE' and image.filepath and not image.packed_file and not os.path.isfile(bpy.path.abspath(image.filepath))]; assert not missing, 'Missing images: ' + repr(missing)"

      - name: Package the Blender sample without backup files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          sample = Path('BlenderSample')
          blend = sample / 'AGRaceCourse_Template.blend'
          textures = sample / 'Texture'
          if not blend.is_file() or not textures.is_dir():
              raise SystemExit('The .blend file or Texture directory is missing')
          files = [blend, *(path for path in sorted(textures.rglob('*')) if path.is_file())]
          if len(files) == 1:
              raise SystemExit('No sample textures were found')
          with ZipFile('dist/release/AGRaceCourse_Template.zip', 'w', ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          PY

      - name: Generate the Blender repository index
        run: |
          "$BLENDER_BINARY" --background --factory-startup --command extension server-generate \
            --repo-dir dist/pages
          cp README.md dist/pages/README.md
          cp download.html dist/pages/download.html
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          index = json.loads(Path('dist/pages/index.json').read_text(encoding='utf-8'))
          packages = index['data']
          expected = f"./agrace_tools-{os.environ['EXTENSION_VERSION']}.zip"
          if len(packages) != 1 or packages[0]['id'] != 'agrace_tools' or packages[0]['archive_url'] != expected:
              raise SystemExit('The repository index must contain only the latest AGRace Tools ZIP')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

      - name: Publish the Blender repository
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/pages/agrace_tools-${EXTENSION_VERSION}.zip" \
            dist/release/AGRaceCourse_Template.zip \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
